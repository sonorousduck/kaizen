basePath: /
definitions:
  models.CreateUser:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      password:
        minLength: 7
        type: string
    required:
    - email
    - firstName
    - lastName
    - password
    type: object
  models.LoginUser:
    properties:
      email:
        type: string
      password:
        minLength: 7
        type: string
    required:
    - email
    - password
    type: object
  models.UserResponse:
    properties:
      createdAt:
        type: string
      deletedAt:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      lastName:
        type: string
      updatedAt:
        type: string
    required:
    - createdAt
    - deletedAt
    - email
    - firstName
    - id
    - lastName
    - updatedAt
    type: object
host: localhost:8080
info:
  contact: {}
  description: Goal planning + execution
  title: Kaizen API
  version: "1.0"
paths:
  /public/users:
    post:
      consumes:
      - application/json
      description: Register a new user with email and password
      operationId: create-user
      parameters:
      - description: User registration data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateUser'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.UserResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Create a new user
  /public/users/login:
    post:
      consumes:
      - application/json
      description: Login with email and password, returns JWT token in cookie
      operationId: login-user
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.LoginUser'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Login user
  /users/logout:
    post:
      description: Clear the authentication cookie to logout
      operationId: logout-user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Logout user
  /users/me:
    get:
      description: Get the current authenticated user's information
      operationId: get-current-user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get current user
schemes:
- http
- https
swagger: "2.0"
